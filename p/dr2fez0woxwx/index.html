<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Tu proyecto de cocina</title>
<style>
  :root { --green: #1d6b57; --deep: #0f2620; --gold: #c8a462; --ivory: #f6f3ec; --ink: #17201d; --muted: #6d746f; --line: #e4ded2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ivory); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .serif { font-family: "Sitka Heading", Georgia, "Times New Roman", serif; }
  /* Pantalla del código */
  #lock { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(120% 90% at 20% 0%, #2f8a70 0%, #1d6b57 40%, #0c211b 100%); color: #fff; }
  .lock-card { width: min(420px, 100%); text-align: center; }
  .lock-card h1 { font-size: 26px; margin: 18px 0 6px; font-weight: 600; }
  .lock-card p { opacity: .8; margin: 0 0 22px; }
  .lock-card input { width: 100%; font-size: 22px; letter-spacing: .25em; text-align: center; text-transform: uppercase; padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.1); color: #fff; outline: none; }
  .lock-card input:focus { border-color: var(--gold); }
  .lock-card button, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 14px 20px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; }
  @media (max-width: 600px) { header.top img + .name { display: none; } }
  .lock-card button { width: 100%; margin-top: 12px; background: linear-gradient(180deg, #e3c689, #c8a462); color: #1c1a14; }
  .lock-card .err { color: #ffcfc9; min-height: 22px; margin-top: 10px; font-size: 14px; }
  .mark { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto; background: linear-gradient(135deg, #3a9e82, #113a30); display: grid; place-items: center; font: 700 30px Georgia, serif; color: #f5d697; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  /* Presentación */
  #app { display: none; }
  header.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: rgba(246,243,236,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  header.top img { height: 34px; max-width: 140px; object-fit: contain; }
  header.top .name { font-weight: 700; color: var(--deep); }
  header.top .grow { flex: 1; }
  .hero { position: relative; height: min(72vh, 620px); background: #ddd center/cover no-repeat; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(8,24,19,.75)); }
  .hero .cap { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 26px 22px; color: #fff; }
  .hero .cap .eyebrow { color: #f0d9a6; letter-spacing: .14em; font-size: 12px; text-transform: uppercase; font-weight: 600; }
  .hero .cap h1 { margin: 6px 0 0; font-size: clamp(26px, 5vw, 42px); line-height: 1.1; font-weight: 600; }
  main { max-width: 1040px; margin: 0 auto; padding: 8px 18px 60px; }
  section { margin-top: 34px; }
  h2 { font-size: 24px; margin: 0 0 14px; font-weight: 600; color: var(--deep); }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .gallery figure { margin: 0; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.05); cursor: zoom-in; }
  .gallery img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; }
  .gallery figcaption { padding: 8px 12px; font-size: 13px; color: var(--muted); }
  .tour { position: relative; border-radius: 16px; overflow: hidden; background: #111; height: min(70vh, 560px); touch-action: none; }
  .tour canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  .tour .hint { position: absolute; left: 12px; bottom: 12px; background: rgba(0,0,0,.55); color: #fff; font-size: 12.5px; padding: 6px 10px; border-radius: 10px; pointer-events: none; }
  .tour .fs { position: absolute; right: 12px; top: 12px; background: rgba(0,0,0,.55); color: #fff; border: 0; border-radius: 10px; padding: 8px 10px; cursor: pointer; }
  .points { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .points button { border: 1px solid var(--line); background: #fff; border-radius: 20px; padding: 7px 14px; font: inherit; font-size: 13.5px; cursor: pointer; }
  .points button.on { background: var(--green); border-color: var(--green); color: #fff; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
  .plan svg { width: 100%; height: auto; max-height: 520px; display: block; }
  .fins { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .fin { display: flex; align-items: center; gap: 12px; }
  .fin i { width: 34px; height: 34px; border-radius: 8px; border: 1px solid rgba(0,0,0,.12); flex: none; }
  .fin b { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 9px 4px; border-bottom: 1px solid var(--line); }
  td.r { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tr.total td { border: 0; font-size: 22px; font-weight: 700; color: var(--deep); padding-top: 14px; }
  .cond { white-space: pre-wrap; color: var(--muted); font-size: 13.5px; margin-top: 12px; }
  .accept { text-align: center; padding: 26px 18px; background: linear-gradient(180deg, #fff, #faf6ec); }
  .accept p { color: var(--muted); margin: 6px 0 16px; }
  .btn.wa { background: #1f8f5f; color: #fff; } .btn.mail { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  footer { text-align: center; color: var(--muted); font-size: 12.5px; padding: 30px 18px 40px; }
  .zoom { position: fixed; inset: 0; background: rgba(8,12,10,.92); display: none; place-items: center; z-index: 20; cursor: zoom-out; }
  .zoom img { max-width: 96vw; max-height: 92vh; border-radius: 8px; }
  .gone { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 30px; color: var(--muted); }
</style>
</head>
<body>
<div id="lock">
  <form class="lock-card" id="lockForm" autocomplete="off">
    <div class="mark">N</div>
    <h1 class="serif">Tu proyecto de cocina</h1>
    <p>Escribe el código que te hemos enviado para verlo.</p>
    <input id="code" inputmode="text" maxlength="12" placeholder="XXXX-XXXX" autocapitalize="characters" spellcheck="false" aria-label="Código de acceso">
    <button type="submit" id="go">Ver mi proyecto</button>
    <div class="err" id="err"></div>
  </form>
</div>
<div id="app"></div>
<div class="zoom" id="zoom"><img alt=""></div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => Number(n || 0).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
  let blob = null;
  fetch('data.bin', { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(b => { blob = new Uint8Array(b); })
    .catch(() => { document.body.innerHTML = '<div class="gone"><div><h2 class="serif">Este enlace ya no está disponible</h2><p>Pide a tu estudio un enlace nuevo.</p></div></div>'; });

  async function decrypt(code) {
    // Formato: «NXS1» + sal (16) + vector (12) + datos cifrados AES-GCM (con la etiqueta al final). Clave: PBKDF2-SHA256.
    const magic = new TextDecoder().decode(blob.slice(0, 4));
    if (magic !== 'NXS1') throw new Error('formato');
    const salt = blob.slice(4, 20), iv = blob.slice(20, 32), data = blob.slice(32);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
    return JSON.parse(new TextDecoder().decode(plain));
  }

  $('#lockForm').addEventListener('submit', async e => {
    e.preventDefault();
    const code = $('#code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!blob) { $('#err').textContent = 'Cargando… inténtalo en un momento.'; return; }
    $('#go').disabled = true; $('#err').textContent = 'Abriendo…';
    try { render(await decrypt(code)); }
    catch { $('#err').textContent = 'Código incorrecto. Revísalo e inténtalo de nuevo.'; }
    finally { $('#go').disabled = false; }
  });

  function render(d) {
    if (d.expiresAt && Date.now() > Date.parse(d.expiresAt)) { document.body.innerHTML = '<div class="gone"><div><h2 class="serif">Este enlace ha caducado</h2><p>Pide a tu estudio un enlace nuevo.</p></div></div>'; return; }
    document.title = `${d.project.name} · ${d.company.name}`;
    const c = d.company, hero = d.photos[0]?.image;
    const accept = encodeURIComponent(`Hola, soy ${d.client?.name || ''}. Acepto el presupuesto ${d.project.code} (${d.project.name}) por ${money(d.quote.total)}.`);
    const wa = (c.phone || '').replace(/[^0-9]/g, '');
    const waNum = wa.length === 9 ? '34' + wa : wa;
    $('#app').innerHTML = `
      <header class="top">${c.logo ? `<img src="${c.logo}" alt="">` : ''}<span class="name">${esc(c.name)}</span><span class="grow"></span>${c.phone ? `<a class="btn mail" style="padding:8px 12px" href="tel:${esc(c.phone)}">Llamar</a>` : ''}</header>
      <div class="hero" style="${hero ? `background-image:url('${hero}')` : 'background:#1d6b57'}"><div class="cap"><div class="eyebrow">${esc(d.project.code)}${d.client?.name ? ' · ' + esc(d.client.name) : ''}</div><h1 class="serif">${esc(d.project.name)}</h1></div></div>
      <main>
        ${d.panos.length ? `<section><h2 class="serif">Recorrido 360°</h2><div class="tour" id="tour"><canvas></canvas><div class="hint">Arrastra para mirar alrededor · pellizca o usa la rueda para acercar</div><button class="fs" id="fs" aria-label="Pantalla completa">⤢</button></div><div class="points">${d.panos.map((p, i) => `<button data-i="${i}" class="${i ? '' : 'on'}">${esc(p.label)}</button>`).join('')}</div></section>` : ''}
        ${d.photos.length ? `<section><h2 class="serif">Así quedará</h2><div class="gallery">${d.photos.map(p => `<figure><img src="${p.image}" alt="${esc(p.label)}" loading="lazy"><figcaption>${esc(p.label)}</figcaption></figure>`).join('')}</div></section>` : ''}
        ${d.plan ? `<section><h2 class="serif">Planta</h2><div class="card plan">${d.plan}</div></section>` : ''}
        ${d.finishes.length ? `<section><h2 class="serif">Acabados</h2><div class="card fins">${d.finishes.map(f => `<div class="fin"><i style="background:${esc(f.color)}"></i><div><b>${esc(f.label)}</b>${esc(f.name)}</div></div>`).join('')}</div></section>` : ''}
        <section><h2 class="serif">Presupuesto</h2><div class="card"><table>
          ${d.quote.groups.map(g => `<tr><td>${esc(g.group)}</td><td class="r">${money(g.total)}</td></tr>`).join('')}
          ${d.quote.discount ? `<tr><td>Descuento</td><td class="r">−${money(d.quote.discount)}</td></tr>` : ''}
          <tr><td>IVA</td><td class="r">${money(d.quote.vat)}</td></tr>
          <tr class="total"><td class="serif">Total</td><td class="r">${money(d.quote.total)}</td></tr>
        </table>${d.conditions ? `<div class="cond">${esc(d.conditions)}</div>` : ''}</div></section>
        <section class="card accept"><h2 class="serif">¿Te gusta?</h2><p>Si quieres seguir adelante o cambiar algo, escríbenos.</p><div class="btns">
          ${waNum ? `<a class="btn wa" href="https://wa.me/${waNum}?text=${accept}" target="_blank" rel="noopener">Acepto el presupuesto</a>` : ''}
          ${c.email ? `<a class="btn mail" href="mailto:${esc(c.email)}?subject=${encodeURIComponent('Presupuesto ' + d.project.code)}&body=${accept}">Escribir por correo</a>` : ''}
          ${waNum ? `<a class="btn mail" href="https://wa.me/${waNum}?text=${encodeURIComponent('Hola, sobre el presupuesto ' + d.project.code + ' me gustaría cambiar: ')}" target="_blank" rel="noopener">Pedir un cambio</a>` : ''}
        </div></section>
      </main>
      <footer>${esc(c.name)}${c.web ? ' · ' + esc(c.web) : ''}<br>Enlace válido hasta el ${new Date(d.expiresAt).toLocaleDateString('es-ES')} · Imágenes de simulación</footer>`;
    $('#lock').style.display = 'none'; $('#app').style.display = 'block';
    document.querySelectorAll('.gallery figure').forEach(f => f.addEventListener('click', () => { const z = $('#zoom'); z.querySelector('img').src = f.querySelector('img').src; z.style.display = 'grid'; }));
    $('#zoom').addEventListener('click', () => { $('#zoom').style.display = 'none'; });
    if (d.panos.length) tour(d.panos);
  }

  // Visor 360°: WebGL con un sombreador que proyecta la panorámica equirectangular según hacia dónde se mira.
  function tour(panos) {
    const box = $('#tour'), cv = box.querySelector('canvas');
    const gl = cv.getContext('webgl2') || cv.getContext('webgl');
    if (!gl) { box.innerHTML = `<img src="${panos[0].image}" style="width:100%;height:100%;object-fit:cover">`; return; }
    const gl2 = typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext;
    const vs = gl2 ? '#version 300 es\nin vec2 p; out vec2 uv; void main(){ uv = p; gl_Position = vec4(p, 0.0, 1.0); }' : 'attribute vec2 p; varying vec2 uv; void main(){ uv = p; gl_Position = vec4(p, 0.0, 1.0); }';
    const fs = `precision highp float; varying vec2 uv; uniform sampler2D tex; uniform float yaw, pitch, fov, aspect;
      void main(){
        vec3 d = normalize(vec3(uv.x * tan(fov * 0.5) * aspect, uv.y * tan(fov * 0.5), -1.0));
        float cp = cos(pitch), sp = sin(pitch); d = vec3(d.x, d.y * cp + d.z * sp, -d.y * sp + d.z * cp);
        float cy = cos(yaw), sy = sin(yaw); d = vec3(d.x * cy + d.z * sy, d.y, -d.x * sy + d.z * cy);
        float u = atan(d.x, -d.z) / 6.2831853 + 0.5, v = acos(clamp(d.y, -1.0, 1.0)) / 3.1415927;
        gl_FragColor = texture2D(tex, vec2(fract(u), v));
      }`;
    // WebGL2: derivadas calculadas sin el salto de u en la costura (si no, se ve una línea borrosa vertical).
    const fs2 = `#version 300 es
      precision highp float; in vec2 uv; out vec4 color; uniform sampler2D tex; uniform float yaw, pitch, fov, aspect;
      void main(){
        vec3 d = normalize(vec3(uv.x * tan(fov * 0.5) * aspect, uv.y * tan(fov * 0.5), -1.0));
        float cp = cos(pitch), sp = sin(pitch); d = vec3(d.x, d.y * cp + d.z * sp, -d.y * sp + d.z * cp);
        float cy = cos(yaw), sy = sin(yaw); d = vec3(d.x * cy + d.z * sy, d.y, -d.x * sy + d.z * cy);
        float u = atan(d.x, -d.z) / 6.2831853 + 0.5, v = acos(clamp(d.y, -1.0, 1.0)) / 3.1415927;
        vec2 du = vec2(dFdx(u), dFdy(u)); du -= floor(du + 0.5);
        color = textureGrad(tex, vec2(u, v), vec2(du.x, dFdx(v)), vec2(du.y, dFdy(v)));
      }`;
    const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
    const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, gl2 ? fs2 : fs)); gl.linkProgram(pr); gl.useProgram(pr);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const U = n => gl.getUniformLocation(pr, n);
    const tex = gl.createTexture();
    // Campo de visión inicial ≈ 90° en horizontal (como una foto gran angular): más abierto deforma los bordes.
    const fov0 = () => Math.min(1.35, 2 * Math.atan(Math.tan(0.8) / Math.max(0.6, cv.clientWidth / Math.max(1, cv.clientHeight))));
    let yaw = 0, pitch = 0, fov = fov0(), ready = false;
    // Panorámica en la GPU: con mipmaps y filtro anisótropo; si el móvil no admite texturas tan grandes, se reduce antes.
    const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
    const load = i => { const img = new Image(); img.decoding = 'async'; img.onload = () => {
      let src = img;
      if (img.width > maxTex) { const c = document.createElement('canvas'); c.width = maxTex; c.height = maxTex / 2; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); src = c; }
      gl.bindTexture(gl.TEXTURE_2D, tex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, src);
      const pot = ((src.width & (src.width - 1)) === 0 && (src.height & (src.height - 1)) === 0);
      const mip = gl2 || pot; if (mip) gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mip ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl2 || pot ? gl.REPEAT : gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      const an = gl.getExtension('EXT_texture_filter_anisotropic'); if (an) gl.texParameterf(gl.TEXTURE_2D, an.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(16, gl.getParameter(an.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
      ready = true; draw(); }; img.src = panos[i].image; };
    const draw = () => {
      const w = cv.clientWidth * devicePixelRatio, h = cv.clientHeight * devicePixelRatio;
      if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
      gl.viewport(0, 0, cv.width, cv.height);
      if (!ready) return;
      gl.uniform1f(U('yaw'), yaw); gl.uniform1f(U('pitch'), pitch); gl.uniform1f(U('fov'), fov); gl.uniform1f(U('aspect'), cv.width / cv.height);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    };
    yaw = panos[0].yaw || 0; load(0);
    const pts = new Map(); let last = null, pinch = 0;
    cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); last = [e.clientX, e.clientY]; });
    cv.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, [e.clientX, e.clientY]);
      if (pts.size === 2) { const [a, b] = [...pts.values()]; const dd = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) fov = Math.min(1.9, Math.max(0.5, fov * pinch / dd)); pinch = dd; draw(); return; }
      const k = fov / cv.clientHeight;
      yaw -= (e.clientX - last[0]) * k; pitch = Math.max(-1.45, Math.min(1.45, pitch + (e.clientY - last[1]) * k));
      last = [e.clientX, e.clientY]; draw();
    });
    const up = e => { pts.delete(e.pointerId); pinch = 0; if (pts.size === 1) last = [...pts.values()][0]; };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    cv.addEventListener('wheel', e => { e.preventDefault(); fov = Math.min(1.9, Math.max(0.5, fov * Math.exp(e.deltaY * 0.001))); draw(); }, { passive: false });
    addEventListener('resize', draw);
    document.querySelectorAll('.points button').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('.points button').forEach(x => x.classList.remove('on')); b.classList.add('on'); pitch = 0; fov = fov0(); ready = false; yaw = panos[Number(b.dataset.i)]?.yaw || 0; load(Number(b.dataset.i)); }));
    $('#fs').addEventListener('click', () => { (document.fullscreenElement ? document.exitFullscreen() : box.requestFullscreen?.())?.catch?.(() => {}); setTimeout(draw, 200); });
  }
})();
</script>
</body>
</html>
